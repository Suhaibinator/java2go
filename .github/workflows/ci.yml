name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same ref supersedes an in-flight run. The test matrix is
# expensive (a real JDK compiles and runs every fixture, then the generated Go
# is built and run again), so there is no value in finishing a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  JAVA_VERSION: "21"

jobs:
  # The test suite is split across parallel jobs rather than run as a single
  # `go test ./...`.
  #
  # Two reasons. Wall clock: the application-parity corpus alone runs for
  # roughly ten minutes, and running it concurrently with everything else makes
  # the slowest job the total rather than the sum. And timeouts: `go test`
  # allows ten minutes per package by default, which the e2e package as a whole
  # now exceeds, so each job also gets an explicit budget matched to its work.
  #
  # Only the jobs that shell out to a JDK install one.

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # These packages exercise the transpiler and runtime in process; nothing
      # here invokes javac.
      - name: Run unit tests
        run: >
          go test -v -race -timeout 20m
          -coverprofile=coverage-unit.out
          ./astutil/... ./stdjava/... ./symbol/... ./transpiler/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.out

  e2e-other:
    name: E2E (non-parity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Everything in ./e2e except the parity corpus, which has its own job.
      # Expressed as a skip rather than a list of test names so the two jobs
      # partition the package exactly: a test added later lands here
      # automatically instead of being silently dropped by both filters.
      - name: Run e2e tests
        run: go test -v -race -timeout 25m -skip '^TestApplicationParity$' ./e2e

  e2e-parity:
    name: Application parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The multi-package application corpus. This is the longest job, and the
      # only one that reads JAVA2GO_PARITY_STRICT, which turns every remaining
      # known-gap fixture into a hard failure.
      - name: Run application parity
        env:
          JAVA2GO_PARITY_STRICT: "1"
        run: go test -v -race -timeout 40m -run '^TestApplicationParity$' ./e2e

  fuzz:
    name: Fuzz corpus replay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Replays every saved divergence through the live transpiler.
      - name: Replay fuzz corpus
        run: go test -v -race -timeout 20m ./fuzz/...

  # A single aggregate check, so branch protection can require one job name
  # instead of tracking each shard. It fails when any shard fails or is skipped.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [unit, e2e-other, e2e-parity, fuzz]
    if: always()
    steps:
      - name: Check shard results
        run: |
          echo "unit:       ${{ needs.unit.result }}"
          echo "e2e-other:  ${{ needs.e2e-other.result }}"
          echo "e2e-parity: ${{ needs.e2e-parity.result }}"
          echo "fuzz:       ${{ needs.fuzz.result }}"
          [ "${{ needs.unit.result }}" = "success" ] \
            && [ "${{ needs.e2e-other.result }}" = "success" ] \
            && [ "${{ needs.e2e-parity.result }}" = "success" ] \
            && [ "${{ needs.fuzz.result }}" = "success" ]

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7

  vulnerability-check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
